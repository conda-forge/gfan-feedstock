{% set version = "0.7" %}
{% set name = "gfan" %}

package:
  name: {{ name }}
  version: "{{ version }}"

source:
  fn: {{ name }}{{ version }}.tar.gz
  url: https://users-math.au.dk/~jensen/software/gfan/gfan{{ version }}.tar.gz
  sha256: ab833757e1e4d4a98662f4aa691394013ea9a226f6416b8f8565356d6fcc989e
  patches:
    # patch Makefile to use CXXFLAGS, LDFLAGS, etc.
    - patches/Makefile.patch
    # This patch from https://github.com/sagemath/sage
    # Comment out delete of miscompiled class (clang issue)
    - patches/nodel.patch
    # These 2 Patches from https://github.com/Macaulay2/homebrew-tap
    - patches/circuittableint.patch
    - patches/gfanlib_z.patch
    # Use std::pmr instead of std::experimental::pmr (C++17 standard, needed for clang)
    - patches/experimental_pmr.patch
    # Add missing #include <atomic> and #include <memory>
    - patches/missing_includes.patch

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
    - gfan  # [build_platform != target_platform]
  host:
    - gmp
    - cddlib
  run:
    - gmp
    - cddlib

test:
  commands:
    - test -f ${PREFIX}/bin/gfan

about:
  home: https://users-math.au.dk/~jensen/software/gfan/gfan.html
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Gfan is a software package for computing Gröbner fans and tropical varieties
  doc_url: https://users-math.au.dk/~jensen/software/gfan/gfanmanual0.5.pdf

extra:
  recipe-maintainers:
    - isuruf
    - saraedum
